# Fabric Russia homeserver (fabric-russia, Yandex Cloud). Deployed to /opt/fabric.
# POSTGRES_PASSWORD comes from /opt/fabric/.env, created on the server by scripts/setup-server.sh.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/fabric/.env}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes: ["./pgdata:/var/lib/postgresql/data"]
  synapse:
    image: matrixdotorg/synapse:v1.164.2
    restart: unless-stopped
    depends_on: [db]
    volumes: ["./data:/data"]
    ports: ["127.0.0.1:8008:8008"]
